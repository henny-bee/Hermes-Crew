name: Bug report
description: Something in Hermes Crew does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `hermes-crew doctor` first — it explains most installation problems.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hermes-tmux in an empty folder
        2. "Create a team with ..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hermes-crew doctor`
      render: text
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      description: Output of `hermes --version`
    validations:
      required: true
  - type: input
    id: crew-version
    attributes:
      label: Hermes Crew version
      description: Output of `hermes-crew --version` or the version in `plugin.yaml`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - Windows 10/11 with WSL2
        - Linux
        - Other (please describe below)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Lines from `hermes-crew log` or `hermes-crew status` (remove anything private).
      render: text
