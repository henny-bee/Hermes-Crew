name: ci

# Branch pushes and PRs run CI directly. Tag pushes are handled by release.yml, which calls this
# workflow (workflow_call) first, so CI never runs twice for a release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Every place that carries the version agrees with __version__ (and, on tag runs, with the git tag).
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # the tag check reads the latest v* tag
          fetch-tags: true
      # Branches and PRs: files only, so a PR that bumps the version before it is tagged stays green.
      - name: Version files agree
        run: bash scripts/check-version.sh --no-tag
      # Tag runs (release.yml calls this workflow): the tag must equal __version__ too.
      - name: Git tag matches
        if: github.ref_type == 'tag'
        run: bash scripts/check-version.sh

  # README "Tested with" row matches hermes_crew.compat.KNOWN (stdlib only, no install needed).
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/gen-compat-row.py --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: mypy --strict plugin/hermes-crew/hermes_crew

  # Unit tests with the coverage gate (>= 90 %) on every supported Python.
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest tests/py -q --cov=hermes_crew --cov-fail-under=90

  # shellcheck over every shell script we ship or run in CI.
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck --version
      - name: shellcheck
        run: |
          # bin/ also holds Python entry points (hermes-crew): check only files with a shell shebang
          files=$(grep -lE '^#!.*(ba)?sh' bin/* install.sh tests/run.sh tests/fake-hermes scripts/*.sh tests/smoke/*.sh)
          # shellcheck disable=SC2086 # word-splitting of the file list is intended
          shellcheck -s bash -x $files

  # Integration tests: real tmux, fake Hermes (tests/fake-hermes), throwaway HOME. macOS runs the stock
  # /bin/bash 3.2, which is what the scripts must support.
  shell-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install tmux (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install tmux (brew)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Versions
        run: tmux -V && bash --version | head -1 && python3 --version
      - run: bash tests/run.sh
